name: CI

on:
  pull_request:
    branches-ignore:
      - UWP
  push:
    branches-ignore:
      - master
      - UWP
    tags-ignore:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.head_ref != 'UWP'
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
